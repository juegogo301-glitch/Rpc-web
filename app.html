<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPC</title><meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RPC"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--c:#1E1E1E;--y:#FFD60A;--r:#FF3B30;--m:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px Inter,system-ui,sans-serif;padding:0 16px 96px}
h1,h2{margin:0}.w{max-width:480px;margin:0 auto}
.card{background:var(--c);border-radius:16px;padding:16px;margin:12px 0}
input,select{width:100%;height:48px;background:var(--bg);border:1px solid #333;border-radius:12px;color:#fff;padding:0 12px;font:inherit;margin:4px 0}
label{font-size:13px;color:var(--m)}input:disabled{opacity:.55}.lock{position:relative;overflow:hidden}.blur{opacity:.5;pointer-events:none;user-select:none}.veil{position:absolute;inset:0;background:#121212b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;text-align:center;border:0;border-radius:14px;background:var(--y);color:#000;font:800 16px Inter;text-decoration:none;margin:8px 0;cursor:pointer}
.btn.g{background:#25D366}.btn.s{background:#333;color:#fff}.btn.o{background:none;border:1px dashed var(--y);color:var(--y)}
.btn.sm{min-height:40px;font-size:14px;display:inline-flex;width:auto;padding:0 14px;margin:4px 4px 0 0}
.err{color:var(--r);font-size:14px}.m{color:var(--m);font-size:13px}.big{font-size:32px;font-weight:900;color:var(--y);margin:8px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.ban{background:var(--y);color:#000;border-radius:999px;padding:14px;text-align:center;font-weight:800;margin:12px 0;cursor:pointer}.ban.red{background:var(--r);color:#fff;animation:p 1s infinite alternate}@keyframes p{to{opacity:.55}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--m);font:600 12px Inter;padding:10px 2px}nav .on{color:var(--y)}
.fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--y);border:0;font-size:24px}
.fab.l{left:16px;right:auto;font-weight:900;font-size:30px}#app{padding-top:env(safe-area-inset-top,0px)}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov>div{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.k{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k .card{margin:0}.k b{font-size:24px;display:block}
.chip{padding:12px;border-radius:999px;background:#2a2a2a;border:0;color:var(--m);font:700 15px Inter}.chip.on{background:var(--y);color:#000}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB='https://ttmgsdidkdqilxbnxnvx.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0bWdzZGlka2RxaWx4Ym54bnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTgzNTgsImV4cCI6MjEwNzc3NDM1OH0.uNs4KetaOmx8gTNRjNrt6HZFB9JXQxnwbTjB8faO5Ug',WA='5491160389894',MP='https://mpago.la/1qNVt95',DOM='@rindepro.app';
const sb=supabase.createClient(SB,KEY),app=document.getElementById('app'),q=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});
const dd=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-AR');
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const wa=(n,t)=>`https://wa.me/${n}?text=${encodeURIComponent(t)}`;
let me=null,view='home',mes=hoy().slice(0,7),mode='login',trips,comb,fecha,editing=false,users=[],cache={};
const dias=()=>7-dd(hoy(),me.trial_start);
const acceso=()=>me.es_admin||(me.estado=='prueba'&&dias()>=0)||(me.estado=='activo'&&me.codigo_vence_el>=hoy());
function modal(h,x=1){const o=document.createElement('div');o.className='ov';o.innerHTML='<div>'+h+(x?'<button class="btn s" onclick="this.closest(\'.ov\').remove()">Cerrar</button>':'')+'</div>';document.body.appendChild(o)}
async function loadMe(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;return}const{data}=await sb.from('perfiles').select('*').eq('id',session.user.id).single();me=data}
async function boot(){inv();await loadMe();if(me)await sincBurbuja();render();if(me&&location.hash=='#rapido'&&!window.Android)setTimeout(rapido,400)}
const salir=()=>sb.auth.signOut().then(()=>{me=null;inv();window._pre=0;render()});

async function auth(){
 const u=q('#u').value.trim().toLowerCase(),p=q('#p').value,e=q('#e');e.textContent='';
 if(!/^[a-z0-9._-]{4,30}$/.test(u))return e.textContent='Usuario: mínimo 4 caracteres, sin espacios';
 if(p.length<6)return e.textContent='La contraseña debe tener al menos 6 caracteres';
 let r;
 if(mode=='registro'){const n=q('#n').value.trim(),w=q('#w').value;
  if(n.length<2)return e.textContent='Ingresá tu nombre completo';
  if(!/^11\d{8}$/.test(w))return e.textContent='Ingresá con 11 + tu número, ej: 1155556666';
  r=await sb.auth.signUp({email:u+DOM,password:p,options:{data:{nombre:n,whatsapp:w,username:u,modo:q('#mo').value}}})}
 else r=await sb.auth.signInWithPassword({email:u+DOM,password:p});
 if(r.error)return e.textContent=/already|registered/i.test(r.error.message)?'Ese usuario ya existe':/Invalid login/i.test(r.error.message)?'Usuario o contraseña incorrectos':'No se pudo completar: '+r.error.message;
 boot()}
function authView(){app.innerHTML=`<div style="padding-top:8vh;text-align:center"><div style="width:64px;height:64px;margin:auto;border-radius:16px;background:var(--y);color:#000;font:900 40px/64px Inter">R</div><h1 style="font-weight:900;margin-top:12px">R<span style="color:var(--y)">PC</span></h1><p class="m">Control de ganancias para choferes y repartidores</p></div><div class="card"><h2>${mode=='login'?'Entrar a RPC':'Crear cuenta en RPC'}</h2>${mode=='registro'?`<label>Nombre completo</label><input id="n" maxlength="100"><label>WhatsApp</label><input id="w" inputmode="numeric" placeholder="Ej: 1155556666" maxlength="10" oninput="this.value=this.value.replace(/\\D/g,'')"><p class="m">Ingresá con 11 + tu número, sin 54 ni 9</p><label>¿Cómo trabajás?</label><select id="mo"><option value="chofer">Chofer (Uber, Didi...)</option><option value="repartidor">Repartidor (Rappi, PedidosYa...)</option><option value="ambos">Las dos cosas</option></select>`:''}<label>Nombre de usuario</label><input id="u" autocapitalize="none" maxlength="30" oninput="this.value=this.value.replace(/\\s/g,'').toLowerCase()"><label>Contraseña</label><div style="position:relative"><input id="p" type="password"><button style="position:absolute;right:8px;top:8px;background:none;border:0;font-size:20px" onclick="const i=q('#p');i.type=i.type=='password'?'text':'password'">👁</button></div><p id="e" class="err"></p><button class="btn" onclick="auth()">${mode=='login'?'Entrar':'Crear cuenta y empezar 7 días gratis'}</button><p class="m" style="text-align:center;cursor:pointer" onclick="mode=mode=='login'?'registro':'login';authView()">${mode=='login'?'¿No tenés cuenta? <b style="color:var(--y)">Registrate</b>':'¿Ya tenés cuenta? <b style="color:var(--y)">Entrá</b>'}</p></div>`}

const hdr=()=>`<div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px"><div><h1 style="font-weight:900">R<span style="color:var(--y)">PC</span></h1><span class="m">Hola, ${esc(me.nombre.split(' ')[0])}${me.estado=='prueba'?` · ${Math.max(dias(),0)} días restantes`:''}</span>${me.es_admin?' · <a href="#admin" style="color:var(--y)">Admin</a>':''}</div><button class="chip" onclick="salir()">Salir</button></div>`;
const banner=()=>{if(me.estado!='prueba')return'';const d=dias();return`<div class="ban ${d<=2?'red':''}" onclick="modal(pago())">${d<=2?`Te quedan ${Math.max(d,0)} días - Pagá para no perder tus datos`:`Prueba gratis · Te quedan ${d} días`}</div>`};
const navb=()=>`<nav>${[['home','Inicio'],['cargar','Cargar día'],['hist','Historial'],['pro','⭐ Pro'],['perfil','Perfil']].map(([k,t])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav><button class="fab" onclick="fb()">💬</button>${fabR()}`;
const go=k=>{view=k;if(k=='cargar'){let c=null;try{c=localStorage.getItem('cerrado_'+hoy())}catch(e){}if(c){nuevo();return render()}return cargarFecha(hoy())}render()};
const pago=()=>`<h2>Activá RPC PRO</h2><p class="big">$2990 / mes</p><p>✓ Historial ilimitado<br>✓ Estadísticas completas<br>✓ Soporte por WhatsApp</p><a class="btn" target="_blank" rel="noopener" href="${MP}">Pagar con Mercado Pago</a><a class="btn g" target="_blank" rel="noopener" href="${wa(WA,`Hola, quiero activar RPC PRO. Mi usuario es: ${me.username}. Mi WhatsApp es: ${me.whatsapp}`)}">Ya pagué, avisar por WhatsApp</a><input id="cod" placeholder="RINDE-XXXX" maxlength="10" style="text-transform:uppercase;text-align:center"><button class="btn s" onclick="activar()">Activar 30 días</button><p id="cerr" class="err"></p>`;
async function activar(){const{data,error}=await sb.rpc('activar_codigo',{p_codigo:q('#cod').value});if(error||!data?.ok){q('#cerr').textContent=data?.error||'Error de conexión';return}document.querySelectorAll('.ov').forEach(o=>o.remove());boot()}
function lockView(){app.innerHTML=`<div class="card" style="margin-top:8vh"><h1>${me.estado=='activo'?'Tu acceso mensual venció':'Tu prueba de 7 días terminó'}</h1><p class="m">Para seguir usando RPC y no perder tus datos, pagá tu acceso mensual.</p>${pago()}<button class="btn s" onclick="salir()">Cerrar sesión</button></div>`}

let rid=0,vcache={},mcache={};
const inv=()=>{vcache={};mcache={}};
const cargando='<p class="m" style="text-align:center;padding:48px 0">Cargando…</p>';
async function render(){
 if(!me)return authView();
 if(window.Android&&Android.setPro){Android.setPro(!!pro());if(Android.setModo)Android.setModo(modo())}
 if(location.pathname=='/admin'||location.hash=='#admin')return adminView();
 if(!acceso())return lockView();
 const my=++rid,k=view+'|'+mes,f=({home,cargar:cargarV,hist,perfil,pro:proV})[view],net=view=='home'||view=='hist'||view=='pro';
 if(net)app.innerHTML=hdr()+banner()+(vcache[k]||cargando)+navb();
 const h=await f();
 if(my!==rid)return;
 if(net)vcache[k]=h;
 app.innerHTML=hdr()+banner()+h+navb();
 if(view=='home'&&!window._pre){window._pre=1;setTimeout(()=>{['hist','pro'].forEach(v=>{const kk=v+'|'+mes;if(!vcache[kk])({hist,pro:proV})[v]().then(x=>{if(!vcache[kk])vcache[kk]=x}).catch(()=>{})})},400)}}
const nextMes=()=>{let[y,m]=mes.split('-').map(Number);m++;if(m>12){m=1;y++}return`${y}-${String(m).padStart(2,'0')}-01`};
const mesIn=()=>`<input type="month" value="${mes}" onchange="mes=this.value||mes;render()">`;
async function viajesMes(){const{data}=await sb.from('viajes').select('*').gte('fecha',mes+'-01').lt('fecha',nextMes()).order('fecha',{ascending:false});const v=data||[];mcache[mes]={t:Date.now(),v};return v}
async function home(){const[v,al]=await Promise.all([viajesMes(),alertasRec()]),s=k=>v.reduce((a,x)=>a+Number(x[k]),0),neta=s('ganancia_neta');
 return mesIn()+burb()+teaser()+al+`<div class="card" style="background:var(--y);color:#000"><span>Ganancia neta del mes</span><div class="big" style="color:#000">${money(neta)}</div></div><div class="k"><div class="card"><span class="m">Ganancia total mes</span><b>${money(s('total_ingresos'))}</b></div><div class="card"><span class="m">KM totales</span><b>${Math.round(s('total_km'))} km</b></div><div class="card"><span class="m">Gasto combustible</span><b style="color:var(--r)">${money(s('combustible_costo'))}</b></div><div class="card"><span class="m">Promedio x día</span><b>${money(v.length?neta/v.length:0)}</b></div></div><p class="m" style="text-align:center">${v.length} días cargados este mes</p>`}

const vacio=()=>({origen:'',destino:'',monto:'',km:'',propina:'',app:'',pago:''});
function nuevo(){trips=[vacio()];comb={tipo:'Nafta',l:'',pl:'',m3:'',pm:''};fecha=hoy();editing=false;horas='';kmGps=''}
const costo=()=>(comb.tipo!='GNC'?num(comb.l)*num(comb.pl):0)+(comb.tipo!='Nafta'?num(comb.m3)*num(comb.pm):0);
function tot(){const i=trips.reduce((a,t)=>a+num(t.monto)+num(t.propina),0),k=trips.reduce((a,t)=>a+num(t.km),0),c=costo();return{i,k,c,n:i-c}}
const totHTML=()=>{const t=tot();return[['Total ingresos',money(t.i)],['Total KM',Math.round(t.k)+' km'],['Costo combustible','-'+money(t.c)]].map(([a,b])=>`<div class="row"><span class="m">${a}</span><b style="text-align:right">${b}</b></div>`).join('')+`<div class="row" style="margin-top:8px"><b>Ganancia neta</b><b class="big" style="text-align:right;margin:0">${money(t.n)}</b></div>`};
const calc=()=>q('#tot').innerHTML=totHTML();
const inp=(ph,o,k,i)=>`<input placeholder="${ph}" inputmode="decimal" value="${esc(o[k])}" oninput="${i==null?'comb':'trips['+i+']'}.${k}=this.value;calc()">`;
async function cargarV(){if(pendJor){horas=String(pendJor.horas);kmGps=String(pendJor.km);pendJor=null}return modoCard()+hintCerrado()+`<div class="card"><label>Fecha</label><input type="date" value="${fecha}" onchange="cargarFecha(this.value)"></div>`+trips.map((t,i)=>`<div class="card"><b style="color:var(--y)">${PALA()} ${i+1}</b><div class="row"><input placeholder="${!esCho()?'Comercio':'Origen'}" value="${esc(t.origen)}" oninput="trips[${i}].origen=this.value"><input placeholder="${!esCho()?'Zona de entrega':'Destino'}" value="${esc(t.destino)}" oninput="trips[${i}].destino=this.value"></div><div class="row">${inp('Monto $',t,'monto',i)}${inp('KM',t,'km',i)}</div>${esRep()?`<div class="row">${inp('Propina $ (opcional)',t,'propina',i)}</div>`:''}${selH(i,t)}</div>`).join('')+`<button class="btn o" onclick="trips.push(vacio());render()">+ Agregar otro ${PALA().toLowerCase()}</button><div class="card"><b>Combustible</b><div class="row" style="margin:8px 0">${['Nafta','GNC','Ambos'].map(x=>`<button class="chip ${comb.tipo==x?'on':''}" onclick="comb.tipo='${x}';render()">${x}</button>`).join('')}</div>${comb.tipo!='GNC'?`<div class="row">${inp('Litros nafta',comb,'l')}${inp('$ por litro',comb,'pl')}</div>`:''}${comb.tipo!='Nafta'?`<div class="row">${inp('M3 GNC',comb,'m3')}${inp('$ por M3',comb,'pm')}</div>`:''}</div>${jorCard()}${horasH()}<div class="card" id="tot">${totHTML()}</div><button class="btn" onclick="guardar()">Guardar día</button>`}
async function cargarFecha(f){let data=null;const c=mcache[f.slice(0,7)];if(c&&Date.now()-c.t<120000)data=c.v.find(x=>x.fecha==f)||null;else{if(view=='cargar')app.innerHTML=hdr()+banner()+cargando+navb();const r=await sb.from('viajes').select('*').eq('fecha',f).maybeSingle();data=r.data}if(data){cache[data.id]=data;editar(data.id)}else{nuevo();fecha=f;view='cargar';render()}}
const burb=()=>window.Android?`<div class="card"><b>Burbuja de viajes</b><p class="m">Cargá ${PALP()} desde cualquier pantalla con la burbuja amarilla. Se suman acá solos.</p>${Android.permiso()?'':'<button class="btn sm" onclick="guiaPermiso()">Dar permiso</button>'}<button class="btn sm" onclick="Android.activar()">Activar burbuja</button><button class="btn sm s" onclick="Android.desactivar()">Desactivar</button></div>`:'';
let sinc=false;
async function sincBurbuja(items){if(!me||sinc||(!items&&!window.Android))return;sinc=true;try{const p=items||JSON.parse(Android.pendientes()||'[]');if(!p.length)return;const g={};p.forEach(x=>(g[x.fecha]=g[x.fecha]||[]).push(x));const ok=[];
 for(const f in g){const{data:ex}=await sb.from('viajes').select('*').eq('fecha',f).maybeSingle();const j=(ex&&ex.viajes_json)||[],comb=j.find(a=>a._comb),lista=j.filter(a=>!a._comb);
  g[f].forEach(x=>lista.push({origen:'',destino:'',monto:x.monto,km:0,...(x.propina>0?{propina:x.propina}:{}),...(x.hora!=null?{hora:x.hora}:{}),...(x.app||x.pago?{app:x.app||null,pago:x.pago||null}:{})}));const ing=lista.reduce((a,t)=>a+num(t.monto)+num(t.propina),0);if(comb)lista.push(comb);const costo=ex?Number(ex.combustible_costo):0;
  const{error}=await sb.from('viajes').upsert({user_id:me.id,fecha:f,viajes_json:lista,total_ingresos:ing,total_km:ex?Number(ex.total_km):0,combustible_tipo:ex?ex.combustible_tipo:null,combustible_nafta_litros:ex?ex.combustible_nafta_litros:0,combustible_gnc_m3:ex?ex.combustible_gnc_m3:0,combustible_costo:costo,ganancia_neta:ing-costo},{onConflict:'user_id,fecha'});
  if(!error){g[f].forEach(x=>ok.push(x.id));try{localStorage.removeItem('cerrado_'+f)}catch(e){}}}
 if(ok.length){if(!items)Android.quitar(JSON.stringify(ok));inv();render()}return ok.length}finally{sinc=false}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:16px;right:16px;bottom:96px;background:#333;color:#fff;padding:14px;border-radius:12px;text-align:center;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
async function perfil(){const e=me.estado=='activo'?'Activo · vence '+me.codigo_vence_el:me.estado=='prueba'?'Prueba · '+Math.max(dias(),0)+' días restantes':me.estado;
 return`<div class="card"><h2>Mi perfil</h2><label>Nombre completo</label><input id="pn" maxlength="100" value="${esc(me.nombre)}"><label>Modo de trabajo</label><select id="pm">${[['chofer','Chofer (Uber, Didi...)'],['repartidor','Repartidor (Rappi, PedidosYa...)'],['ambos','Las dos cosas']].map(([v,t])=>`<option value="${v}" ${modo()==v?'selected':''}>${t}</option>`).join('')}</select><label>Usuario</label><input value="${esc(me.username)}" disabled><label>WhatsApp</label><input value="${esc(me.whatsapp)}" disabled><p class="m">El usuario y el WhatsApp no se pueden editar. Para cambiarlos, escribinos por WhatsApp.</p><label>Plan</label><input value="${esc(e)}" disabled><button class="btn" onclick="guardarPerfil()">Guardar cambios</button></div><div class="card"><h2>Cambiar contraseña</h2><label>Contraseña actual</label><input id="pa" type="password"><label>Contraseña nueva</label><input id="pb" type="password"><label>Repetir contraseña nueva</label><input id="pc" type="password"><p id="pe" class="err"></p><button class="btn s" onclick="cambiarPass()">Cambiar contraseña</button></div><div class="card"><h2 style="color:var(--r)">Eliminar cuenta</h2><p class="m">Se borran tu cuenta y todos tus días cargados. No se puede deshacer. Si pagás con la suscripción de Mercado Pago, cancelala también desde tu cuenta de Mercado Pago.</p><button class="btn" style="background:var(--r);color:#fff" onclick="pedirBaja()">Eliminar mi cuenta</button></div>`}
async function guardarPerfil(){const n=q('#pn').value.trim();if(n.length<2)return toast('Ingresá tu nombre completo');const{error}=await sb.rpc('actualizar_perfil',{p_nombre:n,p_modo:q('#pm').value});if(error)return toast('No se pudo guardar');await loadMe();toast('Datos guardados');render()}
async function cambiarPass(){const a=q('#pa').value,b=q('#pb').value,c=q('#pc').value,e=q('#pe');e.textContent='';
 if(b.length<6)return e.textContent='La contraseña nueva debe tener al menos 6 caracteres';
 if(b!=c)return e.textContent='Las contraseñas nuevas no coinciden';
 const r=await sb.auth.signInWithPassword({email:me.username+DOM,password:a});
 if(r.error)return e.textContent='La contraseña actual es incorrecta';
 const u=await sb.auth.updateUser({password:b});
 if(u.error)return e.textContent='No se pudo cambiar: '+u.error.message;

function repHTML(){const{v,lista,m}=repData,s=k=>v.reduce((a,x)=>a+Number(x[k]),0),g=lista.reduce((a,x)=>a+Number(x.monto),0),neta=s('ganancia_neta'),por={};lista.forEach(x=>por[x.categoria]=(por[x.categoria]||0)+Number(x.monto));
 const filas=[...v].sort((a,b)=>a.fecha<b.fecha?-1:1).map(x=>`<tr><td>${x.fecha.split('-').reverse().join('/')}</td><td>${money(x.total_ingresos)}</td><td>${Math.round(x.total_km)}</td><td>${money(x.combustible_costo)}</td><td>${money(x.ganancia_neta)}</td></tr>`).join('');
 return`<html><head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:16px}table{border-collapse:collapse;width:100%;margin-bottom:12px}td,th{border:1px solid #999;padding:6px;text-align:right}th{background:#eee}td:first-child,th:first-child{text-align:left}</style></head><body><h1>Reporte ${m}</h1><p>${esc(me.nombre)} · usuario ${esc(me.username)}</p><table><tr><th>Fecha</th><th>Ingresos</th><th>Km</th><th>Combustible</th><th>Ganancia neta</th></tr>${filas}<tr><th>Total</th><th>${money(s('total_ingresos'))}</th><th>${Math.round(s('total_km'))}</th><th>${money(s('combustible_costo'))}</th><th>${money(neta)}</th></tr></table><h3>Gastos</h3><table>${Object.keys(por).map(k=>`<tr><td>${esc(k)}</td><td>${money(por[k])}</td></tr>`).join('')||'<tr><td>Sin gastos</td><td>-</td></tr>'}<tr><th>Total gastos</th><th>${money(g)}</th></tr></table><h2>Ganancia real: ${money(neta-g)}</h2><p style="color:#666">Generado con RPC a partir de los datos cargados por el usuario. No reemplaza un comprobante fiscal.</p></body></html>`}
function reportePDF(){const h=repHTML(),t='RPC-reporte-'+repData.m;if(window.Android&&Android.imprimir)Android.imprimir(h,t);else{const w=open('','_blank');if(!w)return toast('Permití las ventanas emergentes para ver el reporte');w.document.write(h);w.document.close();w.print()}}
function reporteCSV(){const{v,lista,m}=repData,l=['fecha,ingresos,km,combustible,ganancia_neta,horas'];[...v].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(x=>l.push([x.fecha,x.total_ingresos,x.total_km,x.combustible_costo,x.ganancia_neta,x.horas??''].join(',')));l.push('','gastos_fecha,categoria,monto,nota');lista.forEach(x=>l.push([x.fecha,x.categoria,x.monto,'"'+(x.nota||'').replace(/"/g,'""')+'"'].join(',')));const tx=l.join('\n'),t='RPC-datos-'+m;if(window.Android&&Android.compartir)Android.compartir(tx,t);else if(navigator.share){navigator.share({title:t,text:tx}).catch(()=>{})}else{navigator.clipboard&&navigator.clipboard.writeText(tx);toast('Datos copiados')}}
async function agregarGasto(){const m=num(q('#gm').value);if(m<=0)return toast('Ingresá un monto válido');const{error}=await sb.from('gastos').insert({user_id:me.id,fecha:hoy(),categoria:q('#gc').value,monto:m,nota:q('#gn').value.trim()||null});if(error)return toast('No se pudo guardar el gasto');inv();render()}
async function borrarGasto(id){if(!confirm('¿Eliminar este gasto?'))return;await sb.from('gastos').delete().eq('id',id);inv();render()}
async function guardarMetas(){const{error}=await sb.from('metas').upsert({user_id:me.id,meta_diaria:num(q('#md').value),meta_mensual:num(q('#mm').value)},{onConflict:'user_id'});if(error)return toast('No se pudo guardar');inv();toast('Metas guardadas');render()}
const sumarMeses=(f,n)=>{const d=new Date(f+'T12:00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const adv=r=>{let v=r.vence;if(!v||!r.repite)return v;const n=r.repite=='mensual'?1:6;let g=0;while(v<hoy()&&g++<600)v=sumarMeses(v,n);return v};
function avisar(lista){if(!window.Android||!Android.programarAvisos)return;if(Android.aceites)Android.aceites(JSON.stringify(lista.filter(r=>r.tipo=='Aceite').map(r=>({id:r.id,intervalo:Number(r.km_proximo),inicio:Number(r.km_actual||0),nom:'Cambio de aceite ('+(r.vehiculo||'auto')+')'}))));const a=[],ahora=Date.now();lista.forEach((r,i)=>{const v=adv(r);if(!v||(r.km_proximo!=null&&(r.tipo=='Service'||r.tipo=='Aceite')))return;[[7,'vence en 7 días'],[0,'vence hoy']].forEach(([dias,txt],k)=>{const at=Date.parse(v+'T09:00:00-03:00')-dias*864e5;if(at>ahora)a.push({id:i*2+k,t:'RPC · '+r.tipo,m:r.tipo+' '+txt+(r.nota?' · '+r.nota:''),at})})});Android.programarAvisos(JSON.stringify(a))}
const jorEst=()=>JSON.parse(Android.jornadaEstado());
const fmtH=h=>{const m=Math.max(0,Math.floor(h*60));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const jorHTML=ok=>{if(ok&&!window.Android)return`<h2>Jornada con GPS</h2><p class="m">El cronómetro con GPS está disponible en la app Android.</p>`;
 const e=ok?jorEst():{activa:true,pausa:false,horas:6.3,km:84.3},val=fmtH(e.horas)+' · '+e.km.toFixed(1).replace('.',',')+' km';
 return`<h2>Jornada con GPS ⭐</h2>`+(e.activa?`<div class="big" id="jor">${val}</div><div class="row"><button class="btn sm s" ${ok?'':'disabled'} onclick="jorPausa()">${e.pausa?'Reanudar':'Pausar'}</button><button class="btn sm" ${ok?'':'disabled'} onclick="jorFin()">Terminar jornada</button></div><p class="m">${e.pausa?'En pausa':'Midiendo horas y km con el GPS'}</p>`:`<button class="btn" onclick="jorIni()">Iniciar jornada</button><p class="m">Mide las horas y los km recorridos con el GPS. Al terminar se completan solos los campos del día. No guarda tu recorrido: solo suma los km.</p>`)};
const jorCard=()=>bloque(jorHTML(pro()),pro());

function jorFin(){if(!confirm('¿Terminar la jornada?'))return;const r=JSON.parse(Android.jornadaTerminar());pendJor={horas:Math.round(r.horas*10)/10,km:Math.round(r.km*10)/10};toast('Jornada terminada');go('cargar')}
window.jornadaCambio=()=>render();
setInterval(()=>{const el=q('#jor');if(!el||!window.Android||!Android.jornadaEstado)return;const e=jorEst();if(e.activa)el.textContent=fmtH(e.horas)+' · '+e.km.toFixed(1).replace('.',',')+' km'},1000);
const rangoH=i=>String(i*3).padStart(2,'0')+'–'+String(i*3+3).padStart(2,'0')+' h';
const horariosH=d=>{const mx=Math.max(1,...d.hb.map(b=>b.m));return`<h2>Mejores horarios</h2>`+d.hb.map((b,i)=>`<div class="row" style="align-items:center;margin-top:6px"><span class="m" style="flex:0 0 76px">${rangoH(i)}</span><div style="flex:1;background:#333;border-radius:6px;height:10px"><div style="background:var(--y);width:${Math.round(b.m/mx*100)}%;height:10px;border-radius:6px"></div></div><span style="flex:0 0 84px;text-align:right">${b.n?money(b.m):'-'}</span></div>`).join('')+(d.topH?`<p class="m">Tus mejores horarios: ${d.topH}. Se arma con lo que cargás con la burbuja (guarda la hora) en los últimos 90 días.</p>`:'<p class="m">Cargá con la burbuja para ver en qué horarios ganás más.</p>')};
const calcH=(d,ok)=>`<h2>¿Me conviene este ${PALA().toLowerCase()}?</h2><div class="row"><div><label>Monto $</label><input id="cm" inputmode="decimal" ${ok?'':'disabled'}></div><div><label>Km</label><input id="ck" inputmode="decimal" ${ok?'':'disabled'}></div><div><label>Minutos</label><input id="cn" inputmode="decimal" ${ok?'':'disabled'}></div></div>${ok?'<button class="btn sm" onclick="calcViaje()">Calcular</button>':'<button class="btn sm s" disabled>Calcular</button>'}<div id="cvr" class="m" style="margin-top:8px">${ok?'Lo compara con tu promedio del mes.':'Ejemplo: $4.500 · 6 km · 18 min → 👍 Conviene'}</div>`;
function calcViaje(){const m=num(q('#cm').value),k=num(q('#ck').value),mi=num(q('#cn').value),d=window.cvDat||{},e=q('#cvr');if(m<=0||mi<=0){e.textContent='Ingresá el monto y los minutos';return}
 const neta=m-k*(d.cpk||0),hh=neta/(mi/60),pk=k>0?neta/k:null;let ok=0,tot=0;if(d.hora>0){tot++;if(hh>=d.hora)ok++}if(d.km>0&&pk!=null){tot++;if(pk>=d.km)ok++}
 const v=tot==0?'Todavía no hay un promedio del mes para comparar.':ok==tot?'👍 Conviene: está por encima de tu promedio.':ok==0?'👎 Rinde menos que tu promedio.':'😐 Parecido a tu promedio.';
 e.innerHTML=money(hh)+'/hora'+(pk!=null?' · '+money(pk)+'/km':'')+' (después de combustible)<br>'+v}
function recTipo(){const t=q('#rt').value;q('#rv').style.display=(t=='Service'||t=='Aceite')?'none':'';q('#rk').style.display=t=='Service'?'':'none';q('#rac').style.display=t=='Aceite'?'':'none'}
const aceitesMap=()=>{if(!window.Android||!Android.aceitesEstado)return{};try{return Object.fromEntries(JSON.parse(Android.aceitesEstado()).map(x=>[x.id,x.km]))}catch(e){return{}}};
const aceiteKm=r=>{const m=aceitesMap();return m[r.id]!=null?m[r.id]:Number(r.km_actual||0)};
const contH=()=>window.Android&&Android.contadorEstado?(Android.contadorEstado()?`<p class="m" style="margin-top:12px">📍 Contando los km de tu vehículo con el GPS. <a style="color:var(--y)" onclick="contador(false)">Desactivar</a></p>`:`<div style="margin-top:12px"><button class="btn sm" onclick="contador(true)">Activar contador de km con GPS</button><p class="m">Suma los km de tu vehículo aunque no estés en jornada, para avisarte del cambio de aceite. Gasta algo de batería.</p></div>`):`<p class="m" style="margin-top:12px">El contador automático con GPS está en la app para Android. Acá podés actualizar los km a mano.</p>`;

async function rapidoOk(){const m=num(q('#rm').value);if(m<=0)return toast('Ingresá un monto válido');
 const it={id:Date.now()+'-'+Math.random(),monto:m,fecha:hoy(),hora:Number(new Date().toLocaleString('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',hour12:false}))%24};
 if(esRep()){const p=num(q('#rpr').value);if(p>0)it.propina=p}

window.addEventListener('hashchange',()=>{if(me)render()});
async function guardar(){const t=tot(),tr=trips.filter(x=>x.origen||x.destino||num(x.monto)||num(x.km)||num(x.propina));
 if(!tr.length)return alert('Cargá al menos un viaje');
 if(!editing){const{data}=await sb.from('viajes').select('id').eq('fecha',fecha).maybeSingle();if(data&&!confirm('Ya hay un día guardado en esa fecha. Si seguís, se REEMPLAZA con lo que cargaste ahora (no se suman). ¿Continuar?'))return}
 const{error}=await sb.from('viajes').upsert({user_id:me.id,fecha,viajes_json:[...tr.map(x=>({origen:x.origen,destino:x.destino,monto:num(x.monto),km:num(x.km),...(num(x.propina)>0?{propina:num(x.propina)}:{}),...(x.hora!=null?{hora:x.hora}:{}),...(x.app||x.pago?{app:x.app||null,pago:x.pago||null}:{})})),{_comb:{pl:comb.pl,pm:comb.pm}}],total_ingresos:t.i,total_km:t.k,combustible_tipo:comb.tipo,combustible_nafta_litros:comb.tipo!='GNC'?num(comb.l):0,combustible_gnc_m3:comb.tipo!='Nafta'?num(comb.m3):0,combustible_costo:t.c,ganancia_neta:t.n,...(pro()?{horas:horas===''?null:num(horas),km_gps:kmGps===''?null:num(kmGps)}:{})},{onConflict:'user_id,fecha'});
 if(error)return alert('No se pudo guardar: '+error.message);
 inv();const f0=fecha;try{localStorage.setItem('cerrado_'+f0,'1')}catch(e){}mes=f0.slice(0,7);nuevo();toast('Día guardado ✔');view='cargar';render()}
async function hist(){const v=await viajesMes();cache={};v.forEach(x=>cache[x.id]=x);
 return mesIn()+(v.length?v.map(x=>`<div class="card"><div class="row"><b>${x.fecha.split('-').reverse().join('/')}</b><b style="text-align:right;color:var(--y)">${money(x.ganancia_neta)}</b></div><p class="m">${Math.round(x.total_km)} km · ${x.combustible_tipo||'-'}</p><button class="btn sm s" onclick="editar('${x.id}')">Editar</button><button class="btn sm s" onclick="borrar('${x.id}')">Eliminar</button></div>`).join(''):'<p class="m" style="text-align:center">No hay días cargados en este mes.</p>')}
function editar(id){const x=cache[id],j=x.viajes_json||[],c=(j.find(a=>a._comb)||{})._comb||{};fecha=x.fecha;editing=true;trips=j.filter(a=>!a._comb).map(a=>({origen:a.origen||'',destino:a.destino||'',monto:a.monto||'',km:a.km||'',propina:a.propina||'',hora:a.hora,app:a.app||'',pago:a.pago||''}));if(!trips.length)trips=[vacio()];comb={tipo:x.combustible_tipo||'Nafta',l:x.combustible_nafta_litros||'',pl:c.pl||'',m3:x.combustible_gnc_m3||'',pm:c.pm||''};horas=x.horas==null?'':String(x.horas);kmGps=x.km_gps==null?'':String(x.km_gps);view='cargar';render()}
async function borrar(id){if(!confirm('¿Eliminar este día?'))return;await sb.from('viajes').delete().eq('id',id);inv();render()}

 const[r,p,f]=await Promise.all([sb.rpc('admin_resumen'),sb.from('perfiles').select('*').order('created_at',{ascending:false}),sb.from('feedback').select('*').order('fecha',{ascending:false}).limit(50)]);
 users=p.data||[];const s=r.data||{},nm=Object.fromEntries(users.map(u=>[u.id,u.nombre]));
